version: "3.9"

services:

  api-core:
    build: ./api-core
    container_name: api-core
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mysql-core
      - auth-service
      - order-service
      - menu-service
    environment:
      DB_HOST: mysql-core
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: core_db
      AUTH_URL: http://auth-service:3001
      ORDER_URL: http://order-service:3002
      MENU_URL: http://menu-service:3003
      JWT_SECRET: supersecretkey

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - mysql-auth
    environment:
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: auth_db
      JWT_SECRET: supersecretkey

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - mysql-orders
    environment:
      DB_HOST: mysql-orders
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: orders_db
      JWT_SECRET: supersecretkey

  menu-service:
    build: ./menu-service
    container_name: menu-service
    restart: always
    ports:
      - "3003:3003"
    depends_on:
      - mysql-menu
    environment:
      DB_HOST: mysql-menu
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: menu_db
      JWT_SECRET: supersecretkey

  mysql-core:
    image: mysql:8.0
    container_name: mysql-core
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: core_db
    ports:
      - "3307:3306"

  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: auth_db
    ports:
      - "3308:3306"

  mysql-orders:
    image: mysql:8.0
    container_name: mysql-orders
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: orders_db
    ports:
      - "3309:3306"

  mysql-menu:
    image: mysql:8.0
    container_name: mysql-menu
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: menu_db
    ports:
      - "3310:3306"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api-core
    environment:
      VITE_API_GATEWAY_URL: http://localhost:3000
